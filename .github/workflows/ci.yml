name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel old runs when a new push lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  broker:
    name: broker (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: broker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  docs:
    name: docs (link-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify ADR numbering is contiguous
        shell: bash
        run: |
          set -euo pipefail
          cd docs/decisions
          actual=$(ls -1 [0-9][0-9][0-9][0-9]-*.md | awk -F- '{print $1}' | sort -u)
          expected=$(seq -f "%04g" 1 $(ls -1 [0-9][0-9][0-9][0-9]-*.md | wc -l))
          diff <(echo "$actual") <(echo "$expected")
